
name: Build KESINTISIZ APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Extract project
        run: |
          unzip KESINTISIZ_v0_3_march_kaynak.zip -d source
          find source -name settings.gradle.kts

      - name: Fix Java reserved word in Kotlin sources
        run: |
          find source -type f -name '*.kt' -print0 | xargs -0 sed -i 's/\bcase\b/caseEntity/g'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          echo "Project directory: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KESINTISIZ-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
